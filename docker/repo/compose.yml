# The download repository on the build server - https://autobleem.retromenele.pl (CLAUDE.md, "The download repository"):
# a Caddy container serving the plain directory REPO_DIR (default /home/claude/autobleem-repo), read-only.
#
#   443  HTTPS for autobleem.retromenele.pl - Caddy obtains and renews the Let's Encrypt certificate itself
#        through the TLS-ALPN-01 challenge, which runs over 443: the host's nginx keeps port 80, and nothing
#        here needs root (the Docker daemon binds the ports).
#   9090 plain HTTP, the same tree - the direct http://<server ip>:9090 address, and what a LAN test uses.
#
# Nothing is uploaded through Caddy: publishing is rsync over ssh into REPO_DIR (tools/repo_publish.sh) or a
# copy from the CI runner, which has the same directory mounted. The caddy_data volume holds the certificate;
# do not delete it casually (Let's Encrypt rate-limits re-issues).
#
#   REPO_DIR=/home/claude/autobleem-repo docker compose up -d      # from this directory, as the claude user
#   docker compose logs -f                                         # the ACME exchange on the first HTTPS hit
#
# The admin panel (admin/README.md, the `admin` profile): its service and oauth2-proxy (the GitHub login), on
# this compose network - Caddy routes /admin and /oauth2/ to them on the HTTPS name only.
#
#   docker compose --profile admin up -d --build                   # once admin/.env and admin/app-key.pem exist
#
# The tester portal's intake service (intake/README.md, the `portal` profile): Caddy routes /submit/* to it on
# both listeners. Its data is the intake_data volume, which the admin service reads too (it writes decisions/).
#
#   docker compose --profile portal up -d --build
services:
  caddy:
    image: caddy:2
    container_name: autobleem-repo
    restart: unless-stopped
    ports:
      - "443:443"
      - "9090:9090"
    environment:
      REPO_HOST: ${REPO_HOST:-autobleem.retromenele.pl}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${REPO_DIR:-/home/claude/autobleem-repo}:/srv/repo:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy   # the access log the download counter reads (admin/README.md)
      - ${PRIVATE_CADDY_DIR:-/home/claude/foundry-caddy}:/etc/caddy/private:ro

  # the panel's service: the JSON API and the page (admin/)
  admin:
    profiles: [admin]
    build: ../../admin
    container_name: autobleem-admin
    restart: unless-stopped
    env_file: ../../admin/.env
    environment:
      AB_REPO_DIR: /srv/repo
      AB_DATA_DIR: /data
      AB_ADMIN_TEAMS_FILE: /feed/teams.json
      AB_LOG_DIR: /logs
    volumes:
      - caddy_logs:/logs:ro
      - ${REPO_DIR:-/home/claude/autobleem-repo}:/srv/repo:ro
      # the Teams tab's private feed: the company copies teams.json here. Only this service mounts it - Caddy
      # serves /srv/repo alone, so nothing here is reachable from the web.
      - ${ADMIN_FEED_DIR:-/home/claude/admin-data}:/feed:ro
      - ../../admin/app-key.pem:/run/secrets/app-key.pem:ro
      - admin_data:/data
      # the tester portal's data (intake/README.md): the panel reads all of it and writes decisions/ only, so the
      # mount is read-write. It is the only place besides `intake` that sees this volume.
      - intake_data:/intake

  # the tester portal's intake service (intake/README.md): Caddy routes /submit/* to it on both listeners. It sees
  # the site tree through one read-only mount, testplans/ - nothing else of it - and writes only its own volume.
  # It has no GitHub credentials and no env file.
  intake:
    profiles: [portal]
    build: ../../intake
    container_name: autobleem-intake
    restart: unless-stopped
    environment:
      AB_INTAKE_DIR: /data
      AB_TESTPLANS_DIR: /srv/testplans
      AB_INTAKE_SALT: ${AB_INTAKE_SALT:-}   # empty = generated at start
    volumes:
      - intake_data:/data
      - ${REPO_DIR:-/home/claude/autobleem-repo}/testplans:/srv/testplans:ro

  # the GitHub login in front of it: org members only, the session a secure cookie
  oauth2-proxy:
    profiles: [admin]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: autobleem-login
    restart: unless-stopped
    env_file: ../../admin/.env
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_GITHUB_ORG: autobleem2
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://admin:8000/
      OAUTH2_PROXY_REDIRECT_URL: https://${REPO_HOST:-autobleem.retromenele.pl}/oauth2/callback
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_NAME: _ab_admin
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  admin_data:
  intake_data:
