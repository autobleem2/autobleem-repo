# The download repository on the build server - https://autobleem.retromenele.pl (CLAUDE.md, "The download repository"):
# a Caddy container serving the plain directory REPO_DIR (default /home/claude/autobleem-repo), read-only.
#
#   443  HTTPS for autobleem.retromenele.pl - Caddy obtains and renews the Let's Encrypt certificate itself
#        through the TLS-ALPN-01 challenge, which runs over 443: the host's nginx keeps port 80, and nothing
#        here needs root (the Docker daemon binds the ports).
#   9090 plain HTTP, the same tree - the direct http://<server ip>:9090 address, and what a LAN test uses.
#
# Nothing is uploaded through Caddy: publishing is rsync over ssh into REPO_DIR (tools/repo_publish.sh) or a
# copy from the CI runner, which has the same directory mounted. The caddy_data volume holds the certificate;
# do not delete it casually (Let's Encrypt rate-limits re-issues).
#
#   REPO_DIR=/home/claude/autobleem-repo docker compose up -d      # from this directory, as the claude user
#   docker compose logs -f                                         # the ACME exchange on the first HTTPS hit
#
# The admin panel (admin/README.md, the `admin` profile): its service and oauth2-proxy (the GitHub login), on
# this compose network - Caddy routes /admin and /oauth2/ to them on the HTTPS name only.
#
#   docker compose --profile admin up -d --build                   # once admin/.env and admin/app-key.pem exist
services:
  caddy:
    image: caddy:2
    container_name: autobleem-repo
    restart: unless-stopped
    ports:
      - "443:443"
      - "9090:9090"
    environment:
      REPO_HOST: ${REPO_HOST:-autobleem.retromenele.pl}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${REPO_DIR:-/home/claude/autobleem-repo}:/srv/repo:ro
      - caddy_data:/data
      - caddy_config:/config

  # the panel's service: the JSON API and the page (admin/)
  admin:
    profiles: [admin]
    build: ../../admin
    container_name: autobleem-admin
    restart: unless-stopped
    env_file: ../../admin/.env
    environment:
      AB_REPO_DIR: /srv/repo
      AB_DATA_DIR: /data
    volumes:
      - ${REPO_DIR:-/home/claude/autobleem-repo}:/srv/repo:ro
      - ../../admin/app-key.pem:/run/secrets/app-key.pem:ro
      - admin_data:/data

  # the GitHub login in front of it: org members only, the session a secure cookie
  oauth2-proxy:
    profiles: [admin]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: autobleem-login
    restart: unless-stopped
    env_file: ../../admin/.env
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_GITHUB_ORG: autobleem2
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://admin:8000/
      OAUTH2_PROXY_REDIRECT_URL: https://${REPO_HOST:-autobleem.retromenele.pl}/oauth2/callback
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_NAME: _ab_admin
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

volumes:
  caddy_data:
  caddy_config:
  admin_data:
