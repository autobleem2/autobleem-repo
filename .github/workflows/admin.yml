# The admin panel's deployment: a push to develop that touches admin/ (or the compose file it runs from) is tested,
# then the build server's site checkout (/home/claude/autobleem-site) is fast-forwarded and only the admin
# container rebuilt - Caddy and the site are left alone. Self-hosted: it is that machine's Docker. Gated by
# AB_CI_ENABLED. A Caddyfile change still needs a full `docker compose --profile admin up -d` by hand.
name: admin

on:
  push:
    branches: [develop]
    paths:
      - "admin/**"
      - "docker/repo/compose.yml"
      - ".github/workflows/admin.yml"
  workflow_dispatch:

concurrency:
  group: admin-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64]
    env:
      SITE_DIR: /home/claude/autobleem-site
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD/admin:/admin:ro" -w /admin python:3.12-slim \
            sh -c "pip install -q -r requirements.txt pytest && python -m pytest -q -p no:cacheprovider"
      - name: The site checkout
        run: |
          git -C "$SITE_DIR" fetch -q origin develop
          git -C "$SITE_DIR" merge --ff-only origin/develop
          git -C "$SITE_DIR" log --oneline -1
      - name: Rebuild the admin container
        working-directory: /home/claude/autobleem-site/docker/repo
        run: docker compose --profile admin up -d --build --no-deps admin
      - name: Check it came up
        run: |
          for i in $(seq 1 20); do
            state=$(docker inspect -f '{{.State.Status}}' autobleem-admin 2>/dev/null || true)
            [ "$state" = running ] && sleep 3 && [ "$(docker inspect -f '{{.State.Status}}' autobleem-admin)" = running ] && {
              docker logs --tail 5 autobleem-admin; exit 0; }
            sleep 2
          done
          docker logs --tail 30 autobleem-admin
          exit 1
